<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Commander · PC Commander Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/arcade.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230a0420'/%3E%3Ctext x='50%25' y='58%25' font-size='42' text-anchor='middle' font-family='Arial' fill='%2300f0ff'%3E🎤%3C/text%3E%3C/svg%3E">
  <style>
    .stage {
      border: 3px solid var(--neon-cyan);
      border-radius: 10px;
      padding: 28px 22px;
      text-align: center;
      background: rgba(0, 240, 255, 0.05);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.4), inset 0 0 14px rgba(0, 240, 255, 0.08);
      min-height: 180px;
    }
    .prompt {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #fff;
      text-shadow: 0 0 8px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      margin: 8px 0 4px;
      line-height: 1.3;
    }
    .prompt-tr {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      color: var(--neon-pink);
      text-shadow: 0 0 6px var(--neon-pink);
    }
    .status {
      color: var(--neon-yellow);
      text-shadow: 0 0 6px var(--neon-yellow);
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      margin-top: 18px;
      min-height: 1.5em;
    }
    .feedback { margin-top: 12px; min-height: 4.5em; font-family: 'VT323', monospace; font-size: 1.15rem; }
    .transcript {
      margin-top: 10px;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      color: var(--text-dim);
      min-height: 1.4em;
    }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; align-items: center; }
    .controls input[type="text"] {
      flex: 1 1 240px;
      max-width: 360px;
      padding: 10px 14px;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid var(--neon-cyan);
      border-radius: 6px;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.1);
      outline: none;
    }
    .controls input[type="text"]:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 14px rgba(255, 43, 214, 0.6);
    }
    .controls select {
      padding: 8px 10px;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.55);
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      border-radius: 6px;
    }
    .legend { font-size: 1rem; color: var(--text-dim); margin-top: 10px; }
  </style>
</head>
<body>
  <div id="navHost"></div>
  <div class="page">

    <div class="hud">
      <div class="stat"><span class="label">SCORE</span><span class="value" id="vScore">0</span></div>
      <div class="stat"><span class="label">ROUND</span><span class="value" id="vRound">–</span></div>
      <div class="stat"><span class="label">LIVES</span><span class="value glow-pink" id="vLives">♥♥♥</span></div>
      <div class="stat"><span class="label">BEST</span><span class="value" id="vBest">0</span></div>
    </div>

    <div class="stage">
      <div class="muted" style="font-family:'Press Start 2P',monospace; font-size:0.7rem;">▸ ALEXA SAYS ▸</div>
      <div class="prompt" id="prompt">Press START to begin</div>
      <div class="prompt-tr" id="promptTrans" style="display:none;"></div>
      <div class="status" id="voiceStatus">Loading voices…</div>
      <div class="transcript" id="transcript"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="controls">
      <button class="btn pink" id="btnStart">▶ START</button>
      <select id="langPick" title="Language preference">
        <option value="any">Any language</option>
      </select>
      <button class="btn"        id="btnHear" disabled>🔊 Hear again</button>
      <button class="btn green"  id="btnMic"  disabled>🎤 Listen</button>
    </div>

    <div class="controls">
      <input type="text" id="typeInput" placeholder="…or type the command here" disabled autocomplete="off">
      <button class="btn yellow" id="btnSubmit" disabled>Submit</button>
      <button class="btn"        id="btnSkip"   disabled>Skip</button>
    </div>

    <p class="center muted legend">
      Speak the command Alexa says, in any close approximation — fuzzy match gives partial credit.<br>
      Mic works best in Chrome / Edge. No internet? Type the command instead.
    </p>

  </div>

  <script src="../assets/js/arcade.js"></script>
  <script src="../assets/js/sfx.js"></script>
  <script src="../assets/js/voice.js"></script>
  <script>PCCA.injectNav('voice-commander');</script>
  <script src="../assets/js/voice-commander.js"></script>
</body>
</html>
